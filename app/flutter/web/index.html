<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Where does your Korean actually work? Pick your TOPIK level and see which regions open.">
  <meta name="theme-color" content="#f9f9fc">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="말길 Malgil">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>말길 Malgil</title>
  <link rel="manifest" href="manifest.json">

  <!-- 정적 로딩 셸 (TSD §3 필수 조치 1) — 엔진 부팅 전에 앱 배경색·제목·스켈레톤을 즉시 페인트.
       색은 lib/theme/tokens.dart 와 같다: surface #f9f9fc · on-surface #191c20 · on-surface-variant #43474e
       · surface-container-high #e7e8ee · surface-container-low #f3f4f9 · outline-variant #c4c6cf -->
  <style>
    html, body { margin: 0; padding: 0; background: #f9f9fc; }
    body { font-family: "Pretendard", "Noto Sans KR", Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; color: #191c20; -webkit-font-smoothing: antialiased; }
    #malgil-shell { position: fixed; inset: 0; background: #f9f9fc; z-index: 1; display: flex; justify-content: center; overflow: hidden; }
    #malgil-shell .col { width: 100%; max-width: 480px; display: flex; flex-direction: column; }
    #malgil-shell .bar { height: 64px; display: flex; align-items: center; gap: 6px; padding: 0 16px; }
    #malgil-shell .bar b { font: 400 22px/28px inherit; font-family: inherit; }
    #malgil-shell .bar span { font: 400 14px/20px inherit; font-family: inherit; color: #43474e; }
    #malgil-shell .pad { padding: 0 16px; }
    #malgil-shell .bone { background: linear-gradient(90deg, #e7e8ee 25%, #f3f4f9 37%, #e7e8ee 63%); background-size: 400% 100%; animation: malgil-shimmer 1.4s infinite; border-radius: 6px; }
    #malgil-shell .card { border: 1px solid #c4c6cf; border-radius: 12px; padding: 16px; margin-top: 12px; }
    #malgil-shell .card .bone + .bone { margin-top: 8px; }
    #malgil-shell .foot { margin-top: auto; padding: 12px 16px 20px; border-top: 1px solid #c4c6cf; }
    @keyframes malgil-shimmer { 0% { background-position: 100% 0 } 100% { background-position: 0 0 } }
    @media (prefers-reduced-motion: reduce) { #malgil-shell .bone { animation: none; } }
  </style>
</head>
<body>
  <!-- 로딩 셸: Flutter 첫 프레임(flutter-first-frame) 뒤 제거 -->
  <div id="malgil-shell" aria-hidden="true">
    <div class="col">
      <div class="bar"><b>말길</b><span>Malgil</span></div>
      <div class="pad">
        <div class="bone" style="height:32px;width:78%"></div>
        <div class="bone" style="height:14px;width:96%;margin-top:12px"></div>
        <div class="bone" style="height:14px;width:70%;margin-top:6px"></div>
        <div class="card"><div class="bone" style="height:24px;width:64px"></div><div class="bone" style="height:14px;width:88%"></div></div>
        <div class="card"><div class="bone" style="height:24px;width:64px"></div><div class="bone" style="height:14px;width:82%"></div></div>
        <div class="card"><div class="bone" style="height:24px;width:64px"></div><div class="bone" style="height:14px;width:90%"></div></div>
        <div class="card"><div class="bone" style="height:24px;width:64px"></div><div class="bone" style="height:14px;width:84%"></div></div>
        <div class="bone" style="height:40px;width:100%;margin-top:12px;border-radius:999px"></div>
      </div>
      <div class="foot"><div class="bone" style="height:11px;width:92%"></div><div class="bone" style="height:11px;width:60%;margin-top:5px"></div></div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('malgil-shell');
      if (s && s.parentNode) s.parentNode.removeChild(s);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
